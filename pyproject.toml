[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "iqm-research-award-2026"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "iqm-client[qiskit]==37.0.0",
    "iqm-pulla>=16.0.0",
    "matplotlib>=3.11.1",
    "mthree>=3.0.0",
]

[tool.setuptools]
packages = ["iqm_benchmark"]

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]


[tool.ruff]
line-length = 120
